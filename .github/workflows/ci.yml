name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
        
    - name: Install Playwright
      run: npx playwright install
        
    - name: Run API tests
      run: npx playwright test --project=api --reporter=line,allure-playwright
        
    - name: Run UI tests
      run: npx playwright test --project=ui --reporter=line,allure-playwright
        
    - name: Generate Allure Report
      run: |
        npm install -g allure-commandline
        allure generate allure-results --clean -o allure-report
        
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
        
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    # НОВЫЙ ШАГ: Отправка результатов в Allure TestOps
    - name: Send to Allure TestOps
      run: |
        curl -X POST "https://allure.autotests.cloud/api/result" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ secrets.ALLURE_TESTOPS_TOKEN }}" \
          -d '{
            "projectId": "${{ secrets.ALLURE_PROJECT_ID }}",
            "results": "allure-results"
          }'
      continue-on-error: true
        
    - name: Send Telegram notification on success
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ Тесты прошли успешно!
          
          📊 Репозиторий: ${{ github.repository }}
          🔗 Коммит: ${{ github.sha }}
          🌐 GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          📈 Allure TestOps: https://allure.autotests.cloud/project/PW

    - name: Send Telegram notification on failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ❌ Тесты упали!
          
          📊 Репозиторий: ${{ github.repository }}
          🔗 Коммит: ${{ github.sha }}
          🌐 Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          📈 Allure TestOps: https://allure.autotests.cloud/project/PW