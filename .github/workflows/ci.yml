name: CI Tests - Debug Allure TestOps

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci
        
    - name: Install Playwright
      run: npx playwright install
        
    - name: Run API tests
      run: npx playwright test --project=api --reporter=line,allure-playwright
        
    - name: Run UI tests
      run: npx playwright test --project=ui --reporter=line,allure-playwright
      continue-on-error: true
        
    - name: Generate Allure Report
      run: |
        npm install -g allure-commandline
        allure generate allure-results --clean -o allure-report
        
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    # DEBUG: Проверяем Allure TestOps доступность
    - name: Test Allure TestOps Connection
      run: |
        echo "=== Testing Allure TestOps Connection ==="
        
        # Проверяем доступность API
        api_response=$(curl -s -o /dev/null -w "%{http_code}" \
          "https://allure.autotests.cloud/api/project/5014" \
          -u "allure8:allure8")
        
        echo "API response code: $api_response"
        
        # Пробуем получить информацию о проекте
        curl -s "https://allure.autotests.cloud/api/project/5014" \
          -u "allure8:allure8" | head -100
        
    # DEBUG: Подробная загрузка в Allure TestOps
    - name: Detailed Allure TestOps Upload
      run: |
        echo "=== Detailed Allure TestOps Upload ==="
        
        # Создаем временную папку для тестовых данных
        mkdir -p test-upload
        echo '{"name": "test", "status": "passed"}' > test-upload/test-result.json
        
        # Создаем архив
        cd test-upload
        zip -r ../test-upload.zip .
        cd ..
        
        # Пробуем загрузить тестовые данные
        echo "Uploading test data..."
        response=$(curl -s -o response.txt -w "%{http_code}" \
          -X POST "https://allure.autotests.cloud/api/result" \
          -H "Content-Type: multipart/form-data" \
          -u "allure8:allure8" \
          -F "projectId=5014" \
          -F "launchName=Test Upload" \
          -F "files=@test-upload.zip")
        
        echo "Test upload response: $response"
        if [ -f response.txt ]; then
          echo "Test response body:"
          cat response.txt
        fi
        
        # Теперь загружаем реальные результаты
        echo "Uploading real results..."
        cd allure-results
        zip -r ../real-results.zip .
        cd ..
        
        real_response=$(curl -s -o real-response.txt -w "%{http_code}" \
          -X POST "https://allure.autotests.cloud/api/result" \
          -H "Content-Type: multipart/form-data" \
          -u "allure8:allure8" \
          -F "projectId=5014" \
          -F "launchName=GitHub Run ${{ github.run_number }}" \
          -F "files=@real-results.zip")
        
        echo "Real upload response: $real_response"
        if [ -f real-response.txt ]; then
          echo "Real response body:"
          cat real-response.txt | head -200
        fi
        
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          🔍 Debug workflow completed
          
          Проверьте логи загрузки в Allure TestOps
          Отчет Allure доступен в артефактах