name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
        
    - name: Install Playwright
      run: npx playwright install
        
    - name: Create Allure results directory
      run: mkdir -p allure-results
        
    - name: Run API tests with Allure
      run: |
        echo "=== Running API Tests ==="
        npx playwright test --project=api --reporter=line,allure-playwright
      continue-on-error: true
        
    - name: Run UI tests with Allure
      run: |
        echo "=== Running UI Tests ==="
        npx playwright test --project=ui --reporter=line,allure-playwright
      continue-on-error: true
        
    - name: Check Allure results
      run: |
        echo "=== Checking Allure Results ==="
        echo "Files in allure-results:"
        find allure-results/ -type f | head -20
        echo "File count:"
        find allure-results/ -type f | wc -l
        
    - name: Install Allure Commandline
      run: |
        echo "=== Installing Allure ==="
        npm install -g allure-commandline
        allure --version
        
    - name: Generate Allure Report
      run: |
        echo "=== Generating Allure Report ==="
        allure generate allure-results --clean -o allure-report
        echo "Allure report generated"
        
    - name: List Allure report files
      run: |
        echo "=== Allure Report Files ==="
        ls -la allure-report/
        
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
        
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    # Allure TestOps integration - FIXED CSRF ISSUE
    - name: Upload to Allure TestOps
      run: |
        echo "=== Uploading to Allure TestOps ==="
        
        # Создаем архив с результатами
        cd allure-results
        zip -r ../allure-results.zip .
        cd ..
        
        # Получаем CSRF токен через логин
        echo "Getting CSRF token..."
        csrf_response=$(curl -s -c cookies.txt \
          -X POST "https://allure.autotests.cloud/api/login" \
          -H "Content-Type: application/json" \
          -d '{"username":"allure8","password":"allure8"}')
        
        echo "Login response: $csrf_response"
        
        # Загружаем результаты с использованием сессии
        echo "Uploading results..."
        upload_response=$(curl -s -o upload_response.txt -w "%{http_code}" \
          -b cookies.txt \
          -X POST "https://allure.autotests.cloud/api/result" \
          -H "Content-Type: multipart/form-data" \
          -F "projectId=5014" \
          -F "launchName=GitHub Run ${{ github.run_number }}" \
          -F "files=@allure-results.zip")
        
        echo "Upload response code: $upload_response"
        
        if [ -f upload_response.txt ]; then
          echo "Upload response body:"
          cat upload_response.txt
        fi
        
        if [ "$upload_response" -eq 200 ]; then
          echo "✅ Successfully uploaded to Allure TestOps"
        else
          echo "❌ Failed to upload to Allure TestOps"
          echo "Trying alternative method..."
          
          # Альтернативный метод через allurectl
          wget -q https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -O allurectl
          chmod +x allurectl
          
          ./allurectl upload \
            --project-id 5014 \
            --endpoint https://allure.autotests.cloud \
            --username allure8 \
            --password allure8 \
            --launch-name "GitHub Run ${{ github.run_number }}" \
            allure-results || echo "Allurectl upload failed"
        fi
      continue-on-error: true
        
    - name: Send Telegram notification on success
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ Тесты завершены!
          
          📊 Репозиторий: ${{ github.repository }}
          🔗 Коммит: ${{ github.sha }}
          🌐 GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          📈 Allure Report: Скачайте из артефактов сборки
          📊 Allure TestOps: https://allure.autotests.cloud/project/5014

    - name: Send Telegram notification on failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ⚠️ Workflow завершен с ошибками
          
          📊 Репозиторий: ${{ github.repository }}
          🔗 Коммит: ${{ github.sha }}
          🌐 Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          📈 Allure Report: Скачайте из артефактов сборки