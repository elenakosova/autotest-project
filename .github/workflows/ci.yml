name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
        
    - name: Install Playwright
      run: npx playwright install
        
    - name: Create Allure results directory
      run: mkdir -p allure-results
        
    - name: Run API tests with Allure
      run: |
        echo "=== Running API Tests ==="
        npx playwright test --project=api --reporter=line,allure-playwright
      continue-on-error: true
        
    - name: Run UI tests with Allure
      run: |
        echo "=== Running UI Tests ==="
        npx playwright test --project=ui --reporter=line,allure-playwright
      continue-on-error: true
        
    - name: Check Allure results
      run: |
        echo "=== Checking Allure Results ==="
        echo "Files in allure-results:"
        find allure-results/ -type f | head -20 || echo "No files found"
        echo "File count:"
        find allure-results/ -type f | wc -l || echo "0"
        
    - name: Install Allure Commandline
      run: |
        echo "=== Installing Allure ==="
        npm install -g allure-commandline
        allure --version || echo "Allure not installed"
        
    - name: Generate Allure Report
      run: |
        echo "=== Generating Allure Report ==="
        allure generate allure-results --clean -o allure-report
        echo "Allure report generated"
        
    - name: List Allure report files
      run: |
        echo "=== Allure Report Files ==="
        ls -la allure-report/ || echo "No allure-report directory"
        
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
        
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    # Allure TestOps integration
    - name: Upload to Allure TestOps
      run: |
        echo "=== Uploading to Allure TestOps ==="
        
        # Check if we have results to upload
        if [ $(find allure-results/ -name "*.json" | wc -l) -eq 0 ]; then
          echo "No Allure results found to upload"
          exit 0
        fi
        
        wget -q https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -O allurectl
        chmod +x allurectl
        
        ./allurectl upload \
          --project-id 5014 \
          --endpoint https://allure.autotests.cloud \
          --username allure8 \
          --password allure8 \
          --launch-name "GitHub Run #${{ github.run_number }}" \
          allure-results
        
        echo "=== Upload to Allure TestOps completed ==="
      continue-on-error: true
        
    - name: Send Telegram notification on success
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ Тесты завершены!
          
          📊 Репозиторий: ${{ github.repository }}
          🔗 Коммит: ${{ github.sha }}
          🌐 GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          📈 Allure Report: Скачайте из артефактов сборки
          📊 Allure TestOps: https://allure.autotests.cloud/project/5014

    - name: Send Telegram notification on failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ⚠️ Workflow завершен с ошибками
          
          📊 Репозиторий: ${{ github.repository }}
          🔗 Коммит: ${{ github.sha }}
          🌐 Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}