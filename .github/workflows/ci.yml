name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
        
    - name: Install Playwright
      run: npx playwright install
        
    - name: Run API tests
      run: npx playwright test --project=api --reporter=line,allure-playwright
        
    - name: Run UI tests
      run: npx playwright test --project=ui --reporter=line,allure-playwright
        
    - name: Generate Allure Report
      run: |
        npm install -g allure-commandline
        allure generate allure-results --clean -o allure-report
        
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
        
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    # ИНТЕГРАЦИЯ С ALLURE TESTOPS (ID проекта: 5014)
    - name: Upload to Allure TestOps
      run: |
        echo "=== Uploading to Allure TestOps ==="
        
        # Скачиваем и настраиваем allurectl
        wget -q https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -O allurectl
        chmod +x allurectl
        
        # Проверяем что есть файлы для загрузки
        echo "Files in allure-results:"
        find allure-results/ -name "*.json" -o -name "*.txt" | head -10
        
        # Загружаем в Allure TestOps с ЧИСЛОВЫМ ID 5014
        ./allurectl upload \
          --project-id 5014 \
          --endpoint https://allure.autotests.cloud \
          --username allure8 \
          --password allure8 \
          --launch-name "GitHub Run #${{ github.run_number }}" \
          --launch-tag "github-actions" \
          --launch-tag "autotest-project" \
          allure-results
        
        echo "=== Upload completed ==="
      continue-on-error: true
        
    - name: Send Telegram notification on success
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ Тесты прошли успешно!
          
          📊 Репозиторий: ${{ github.repository }}
          🔗 Коммит: ${{ github.sha }}
          🌐 GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          📈 Allure TestOps: https://allure.autotests.cloud/project/5014

    - name: Send Telegram notification on failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ❌ Тесты упали!
          
          📊 Репозиторий: ${{ github.repository }}
          🔗 Коммит: ${{ github.sha }}
          🌐 Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          📈 Allure TestOps: https://allure.autotests.cloud/project/5014